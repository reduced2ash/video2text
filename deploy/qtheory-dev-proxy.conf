# Included only by Qtheory Dev's page and API locations.
# Capture the real method before auth_request creates its GET subrequest.
set $qtheory_dev_original_method $request_method;
auth_request /_qtheory_dev_auth;
client_max_body_size 50m;
proxy_pass https://100.112.106.74:8443;
proxy_http_version 1.1;
proxy_set_header Host cachyos-x8664.tail4124e4.ts.net:8443;
proxy_ssl_server_name on;
proxy_ssl_name cachyos-x8664.tail4124e4.ts.net;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_buffering off;
proxy_cache off;
proxy_hide_header Cache-Control;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
add_header Cache-Control "no-store" always;
add_header X-Robots-Tag "noindex, nofollow" always;
proxy_connect_timeout 5s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
proxy_intercept_errors on;
