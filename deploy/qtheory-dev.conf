# Include within the existing video2text.org HTTPS server, not qtheory.net.
location ~ ^/apps/quizcraft(?:/|$) {
    include /etc/nginx/snippets/qtheory-dev-proxy.conf;
    error_page 401 /_qtheory_dev_signin;
    error_page 502 503 504 =503 /_qtheory_dev_offline;
}
location ~ ^/api/quizcraft(?:/|$) {
    include /etc/nginx/snippets/qtheory-dev-proxy.conf;
    error_page 401 = @qtheory_dev_unauthorized;
    error_page 502 503 504 = @qtheory_dev_unavailable;
}
location = /_qtheory_dev_auth {
    internal;
    proxy_pass http://127.0.0.1:3000/api/apps/qtheory-dev/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header X-Qtheory-Original-Method $qtheory_dev_original_method;
    proxy_set_header X-Qtheory-Upgrade $http_upgrade;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}
location = /_qtheory_dev_signin {
    internal;
    alias /etc/nginx/snippets/qtheory-dev-signin.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
}
location = /_qtheory_dev_offline {
    internal;
    alias /etc/nginx/snippets/qtheory-dev-offline.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
}
location @qtheory_dev_unauthorized {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 401 '{"error":"Your app-gate session has expired. Sign in at video2text.org, then return to Qtheory Dev."}';
}
location @qtheory_dev_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
    return 503 '{"error":"Qtheory Dev is offline. Wake CachyOS and start its dev server, then retry."}';
}
